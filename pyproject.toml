[project]
name = "pacman"
version = "1.0.0"
description = "Pac-Man clone built for the 42 curriculum"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.5,<3.0",
]

[dependency-groups]
dev = [
    "flake8>=7.0",
    "mypy>=1.8",
    "pytest>=8.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true